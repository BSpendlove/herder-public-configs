# TEMPORARY INSTRUMENTATION. Delete this whole directory when the bulk
# data transport ships, alongside the telemetry profiles next to it.
#
# The saved query for the bulk data capability survey. The profiles in
# telemetry.yaml collect the read-only BulkData capability parameters on
# ordinary sessions; this reads the distribution back out of
# device_parameters, which holds the current value of every parameter a
# device has reported.
#
# Global scope, no deviceSelector: the question is what fraction of the
# fleet can do this, so every panel counts devices across the whole
# fleet rather than describing the device whose page it is on.
#
# One query per exact path. The device_parameters datasource filters on
# a literal path, not a prefix, so a root is a query rather than a
# filter, and the two roots sit side by side in each panel.
apiVersion: dashboards.herder.io/v1alpha1
kind: Dashboard
metadata:
  name: bulkdata-capability-survey
spec:
  schemaVersion: 1
  title: Bulk Data Capability Survey
  description: |
    What fraction of the fleet can deliver a bulk data report, over what
    transport, in what encoding, and at what floor on the reporting
    interval.

    Read the counts as devices that answered, not as the fleet. A device
    is counted here only once it has completed a session carrying the
    capability parameters, and a device with no BulkData subtree faults
    9005 and appears in none of these panels. The gap between the
    answered count and the fleet total is the negative half of the
    survey and lives in device_param_availability, not here.
  defaultTimeRange:
    from: {kind: relative, expr: "now-24h"}
    to: {kind: relative, expr: "now"}
  defaultRefreshIntervalMs: 300000
  panels:
    # ── Answered at all ────────────────────────────────────────────────
    - id: panel-answered-igd
      kind: stat
      title: Answered, InternetGatewayDevice.
      description: Devices reporting a BulkData transport list at the TR-098 root
      descriptionPlacement: bottom
      layout: {x: 0, y: 0, w: 3, h: 4}
      queries:
        - refId: A
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "InternetGatewayDevice.BulkData.Protocols"}
      config:
        unit: null
        format: number
        thresholds: []
        showSparkline: false
        showPriorPeriodDelta: false
        icon: device
    - id: panel-answered-device
      kind: stat
      title: Answered, Device.
      description: Devices reporting a BulkData transport list at the TR-181 root
      descriptionPlacement: bottom
      layout: {x: 3, y: 0, w: 3, h: 4}
      queries:
        - refId: A
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "Device.BulkData.Protocols"}
      config:
        unit: null
        format: number
        thresholds: []
        showSparkline: false
        showPriorPeriodDelta: false
        icon: device
    - id: panel-fleet-total
      kind: stat
      title: Fleet
      description: Every known device, the denominator for the counts beside it
      descriptionPlacement: bottom
      layout: {x: 6, y: 0, w: 3, h: 4}
      queries:
        - refId: A
          version: 1
          datasource: devices
          query:
            agg: count
      config:
        unit: null
        format: number
        thresholds: []
        showSparkline: false
        showPriorPeriodDelta: false
        icon: device
    - id: panel-wildcard
      kind: stat
      title: Partial-path references
      description: Devices reporting ParameterWildCardSupported true at either root
      descriptionPlacement: bottom
      layout: {x: 9, y: 0, w: 3, h: 4}
      queries:
        - refId: A
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters:
              path: "InternetGatewayDevice.BulkData.ParameterWildCardSupported"
              value: "true"
      config:
        unit: null
        format: number
        thresholds: []
        showSparkline: false
        showPriorPeriodDelta: false
        icon: device
    # ── Transport and encoding ─────────────────────────────────────────
    # Protocols and EncodingTypes are comma-separated lists, so a value
    # here is a whole advertised set ("HTTP", "Streaming,File") rather
    # than one transport. Counting the sets verbatim keeps the panel
    # honest about what devices actually said; splitting them would
    # invent a number no device reported.
    - id: panel-protocols
      kind: bar
      title: Transports advertised
      description: Devices by the transport list they report, both roots
      layout: {x: 0, y: 4, w: 6, h: 6}
      queries:
        - refId: A
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "InternetGatewayDevice.BulkData.Protocols"}
            group_by: ["value"]
        - refId: B
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "Device.BulkData.Protocols"}
            group_by: ["value"]
      config:
        orientation: horizontal
        stacking: grouped
        showValueLabels: true
    - id: panel-encodings
      kind: bar
      title: Encodings advertised
      description: Devices by the encoding list they report, both roots
      layout: {x: 6, y: 4, w: 6, h: 6}
      queries:
        - refId: A
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "InternetGatewayDevice.BulkData.EncodingTypes"}
            group_by: ["value"]
        - refId: B
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "Device.BulkData.EncodingTypes"}
            group_by: ["value"]
      config:
        orientation: horizontal
        stacking: grouped
        showValueLabels: true
    # ── What cadence is expressible ────────────────────────────────────
    - id: panel-min-interval
      kind: table
      title: Reporting interval floor
      description: Lowest ReportingInterval each device will accept, in seconds. 0 means no floor
      layout: {x: 0, y: 10, w: 6, h: 6}
      queries:
        - refId: A
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "InternetGatewayDevice.BulkData.MinReportingInterval"}
            group_by: ["value"]
        - refId: B
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "Device.BulkData.MinReportingInterval"}
            group_by: ["value"]
      config:
        columns:
          - {key: "labels.value", label: "Seconds", format: text, align: left}
          - {key: "count", label: "Devices", format: number, align: right}
        defaultSort: {columnKey: "count", direction: desc}
        density: regular
    # Both limits use -1 for unlimited, so the value column is signed and
    # a low positive number is the interesting case: it caps how much of
    # a merged telemetry profile can ride this transport.
    - id: panel-limits
      kind: table
      title: Reference and profile limits
      description: MaxNumberOfParameterReferences and MaxNumberOfProfiles. -1 is unlimited
      layout: {x: 6, y: 10, w: 6, h: 6}
      queries:
        - refId: A
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "InternetGatewayDevice.BulkData.MaxNumberOfParameterReferences"}
            group_by: ["value"]
        - refId: B
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "Device.BulkData.MaxNumberOfParameterReferences"}
            group_by: ["value"]
        - refId: C
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "InternetGatewayDevice.BulkData.MaxNumberOfProfiles"}
            group_by: ["value"]
        - refId: D
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "Device.BulkData.MaxNumberOfProfiles"}
            group_by: ["value"]
      config:
        columns:
          - {key: "labels.value", label: "Limit", format: text, align: left}
          - {key: "count", label: "Devices", format: number, align: right}
        defaultSort: {columnKey: "count", direction: desc}
        density: regular
    # ── Which hardware ─────────────────────────────────────────────────
    # The distribution above answers "how many"; this answers "which",
    # which is what decides whether a proof of concept generalises or is
    # one vendor's firmware.
    - id: panel-by-model
      kind: table
      title: Models advertising a transport
      description: Devices reporting a BulkData transport list, by model
      layout: {x: 0, y: 16, w: 12, h: 6}
      queries:
        - refId: A
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "InternetGatewayDevice.BulkData.Protocols"}
            group_by: ["model"]
        - refId: B
          version: 1
          datasource: device_parameters
          query:
            agg: count
            filters: {path: "Device.BulkData.Protocols"}
            group_by: ["model"]
      config:
        columns:
          - {key: "labels.model", label: "Model", format: text, align: left}
          - {key: "count", label: "Devices", format: number, align: right}
        defaultSort: {columnKey: "count", direction: desc}
        density: regular
