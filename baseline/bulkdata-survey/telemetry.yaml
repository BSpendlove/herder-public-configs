# TEMPORARY INSTRUMENTATION. Delete this whole directory when the bulk
# data transport ships.
#
# Bulk Data Collection (TR-157 Annex A, carried in the data model as
# `Device.BulkData.` and `InternetGatewayDevice.BulkData.`) inverts the
# direction of telemetry collection: the CPE collects on a schedule the
# ACS configures and pushes reports out of band, so nothing rides a CWMP
# session. Whether that is worth building at fleet scale depends on how
# many devices advertise a transport an ACS can receive, which is a
# number no one has. These profiles collect the read-only capability
# parameters so it becomes one.
#
# Why this is temporary and not a baseline addition. Twelve paths on
# every session on every device is exactly the per-session residue cost
# the decision exists to reduce, and GetParameterValues is all-or-nothing
# per TR-069 A.3.2.2: on a CPE with no BulkData subtree every one of
# these faults 9005 and the bridge bisects the batch to isolate them.
# That cost is paid once per device per availability TTL (168h), not once
# per session, but it is real and it is not something to leave running
# after it has answered the question. Once selection can be driven from
# what a device already reported, these move behind capability detection
# and this directory goes away.
#
# Priority 10, matching the shipped baselines, so an operator profile at
# a higher priority still wins on any overlapping path.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: bulkdata-survey-igd
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists
  parameters:
    # Which transports the CPE can deliver a report over, and in what
    # encoding. These two are the survey: a device offering HTTP + JSON
    # is one Herder can receive from, and a device offering only
    # Streaming or File is an IPDR integration that is deliberately out
    # of scope.
    #
    # TR-098 1.8 defines these as Streaming/File and XML/XDR with no HTTP
    # object at all, so the published standard is not the authority on
    # what the installed base does. The ARRIS NVG578LX advertises
    # HTTP and JSON on an InternetGatewayDevice. root (a11-era
    # backport, dmr:version 1.11), which is why this profile exists at
    # this root rather than only on Device.
    - path: "InternetGatewayDevice.BulkData.Protocols"
      interval: 0
    - path: "InternetGatewayDevice.BulkData.EncodingTypes"
      interval: 0
    # The floor the CPE will accept on Profile.{i}.ReportingInterval.
    # A profile asking for less than this is a configuration error, not
    # something to round up, so the distribution of this value across the
    # fleet decides what cadences are expressible at all.
    - path: "InternetGatewayDevice.BulkData.MinReportingInterval"
      interval: 0
    # Whether a Parameter.{i}.Reference may carry a partial path. When
    # false, every partial path in a telemetry profile has to be expanded
    # to concrete instances before it is written, which multiplies the
    # reference count against the limit below.
    #
    # Not defined in TR-098 1.8. A device faulting 9005 here has not
    # said "no wildcards", it has said "I predate the parameter", so the
    # absent case is unknown rather than false.
    - path: "InternetGatewayDevice.BulkData.ParameterWildCardSupported"
      interval: 0
    # Hard limits, and both are -1 for unlimited rather than 0. They
    # decide whether a merged telemetry profile fits in a bulk data
    # profile at all, so they are collected now to avoid a second survey
    # round later.
    - path: "InternetGatewayDevice.BulkData.MaxNumberOfParameterReferences"
      interval: 0
    - path: "InternetGatewayDevice.BulkData.MaxNumberOfProfiles"
      interval: 0
---
# The Device. root half of the same survey. Kept as a separate profile
# rather than one match-all profile with both roots so a dual-stack CPE
# binds both and a single-stack CPE is never asked for paths from a data
# model it does not speak.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: bulkdata-survey-device
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameters:
    # TR-181 2.14 adds HTTP and USPEventNotif to the transport list;
    # 2.20 adds HTTP and MQTT. Both add CSV and JSON to the encodings and
    # both define ParameterWildCardSupported, so unlike the IGD root a
    # 9005 here is a real "not implemented" rather than a version gap.
    - path: "Device.BulkData.Protocols"
      interval: 0
    - path: "Device.BulkData.EncodingTypes"
      interval: 0
    - path: "Device.BulkData.MinReportingInterval"
      interval: 0
    - path: "Device.BulkData.ParameterWildCardSupported"
      interval: 0
    - path: "Device.BulkData.MaxNumberOfParameterReferences"
      interval: 0
    - path: "Device.BulkData.MaxNumberOfProfiles"
      interval: 0
