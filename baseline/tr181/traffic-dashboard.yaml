# Traffic utilisation for TR-181 devices, from the raw interface byte
# counters (`agg: rate` turns each monotonic counter into bytes/second,
# clamping counter resets to zero). Pinned by the baseline device UI
# profile's Monitoring section; also pinnable on its own.
#
# refIds are constrained to [A-Z]{1,4}; the legends read from each
# panel's seriesLabels instead.
apiVersion: dashboards.herder.io/v1alpha1
kind: Dashboard
metadata:
  name: tr181-traffic
spec:
  title: Traffic
  description: Interface throughput from the device's byte counters
  deviceSelector:
    matchExpressions:
      - {key: "dataModel:device", operator: Exists}
  defaultTimeRange:
    from: {kind: relative, expr: "now-6h"}
    to: {kind: relative, expr: "now"}
  defaultRefreshIntervalMs: 60000
  panels:
    - id: panel-wan-throughput
      kind: line
      title: WAN throughput
      layout: {x: 0, y: 0, w: 6, h: 8}
      queries:
        - refId: TX
          version: 1
          datasource: telemetry_history
          query:
            agg: rate
            filters: {path: "Device.Ethernet.Interface.1.Stats.BytesSent"}
        - refId: RX
          version: 1
          datasource: telemetry_history
          query:
            agg: rate
            filters: {path: "Device.Ethernet.Interface.1.Stats.BytesReceived"}
      config:
        showPoints: false
        interpolation: monotone
        yAxis: {kind: auto}
        unit: " B/s"
        seriesLabels: {TX: Up, RX: Down}
        legend:
          displayMode: list
          placement: bottom
          calcs: [last, mean, max]
    - id: panel-radio-throughput
      kind: line
      title: WiFi radio throughput
      layout: {x: 6, y: 0, w: 6, h: 8}
      queries:
        - refId: RATX
          version: 1
          datasource: telemetry_history
          query:
            agg: rate
            filters: {path: "Device.WiFi.Radio.1.Stats.BytesSent"}
        - refId: RARX
          version: 1
          datasource: telemetry_history
          query:
            agg: rate
            filters: {path: "Device.WiFi.Radio.1.Stats.BytesReceived"}
        - refId: RBTX
          version: 1
          datasource: telemetry_history
          query:
            agg: rate
            filters: {path: "Device.WiFi.Radio.2.Stats.BytesSent"}
        - refId: RBRX
          version: 1
          datasource: telemetry_history
          query:
            agg: rate
            filters: {path: "Device.WiFi.Radio.2.Stats.BytesReceived"}
      config:
        showPoints: false
        interpolation: monotone
        yAxis: {kind: auto}
        unit: " B/s"
        seriesLabels:
          RATX: 2.4 GHz up
          RARX: 2.4 GHz down
          RBTX: 5 GHz up
          RBRX: 5 GHz down
        legend:
          displayMode: list
          placement: bottom
          calcs: [last, mean, max]
    - id: panel-ssid-throughput
      kind: line
      title: SSID throughput
      layout: {x: 0, y: 8, w: 12, h: 8}
      queries:
        - refId: SATX
          version: 1
          datasource: telemetry_history
          query:
            agg: rate
            filters: {path: "Device.WiFi.SSID.1.Stats.BytesSent"}
        - refId: SARX
          version: 1
          datasource: telemetry_history
          query:
            agg: rate
            filters: {path: "Device.WiFi.SSID.1.Stats.BytesReceived"}
        - refId: SBTX
          version: 1
          datasource: telemetry_history
          query:
            agg: rate
            filters: {path: "Device.WiFi.SSID.2.Stats.BytesSent"}
        - refId: SBRX
          version: 1
          datasource: telemetry_history
          query:
            agg: rate
            filters: {path: "Device.WiFi.SSID.2.Stats.BytesReceived"}
      config:
        showPoints: false
        interpolation: monotone
        yAxis: {kind: auto}
        unit: " B/s"
        seriesLabels:
          SATX: SSID 1 up
          SARX: SSID 1 down
          SBTX: SSID 2 up
          SBRX: SSID 2 down
        legend:
          displayMode: table
          placement: bottom
          calcs: [last, mean, max]
