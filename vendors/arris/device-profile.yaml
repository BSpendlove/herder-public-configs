# Device UI profile for Arris NVG gateways: the full showcase of the
# section vocabulary on TR-098 hardware. Same tuple as the
# arris-nvg-tr098 mapping profile, and everything here resolves through
# the tables that profile binds. This is also what the demo instance's
# TR-098 simulator renders, so it deliberately exercises every
# component kind: builtins, forms, instance tables, the ports
# faceplate, a pinned dashboard and the auto-resolving one.
apiVersion: deviceprofiles.herder.io/v1alpha1
kind: DeviceProfile
metadata:
  name: arris-nvg-ui
spec:
  priority: 50
  deviceSelector:
    matchLabels:
      oui: "0000C5"
    matchExpressions:
      - key: productClass
        operator: In
        values:
          - "NVG578LX"
          - "NVG448BQ"
          - "NVG468MQ"
          - "NVG589"
          - "NVG599"
  sections:
    - key: overview
      title: Overview
      icon: gauge
      component: overview
    - key: status
      title: Device status
      icon: info
      component: form
      config:
        groups:
          - title: Identity
            fields:
              - {label: Manufacturer, canonical: canonical.device.manufacturer}
              - {label: Model, canonical: canonical.device.model_name}
              - {label: Product class, canonical: canonical.device.product_class}
              - {label: Serial number, canonical: canonical.device.serial_number}
              - {label: Hardware version, canonical: canonical.device.hardware_version}
              - {label: Firmware, canonical: canonical.device.software_version}
              - {label: Uptime, canonical: canonical.device.uptime, format: duration}
          - title: WAN
            fields:
              - {label: Link status, canonical: canonical.interface.wan.status}
              - {label: Access type, canonical: canonical.interface.wan.type}
              - {label: WAN IP address, canonical: canonical.interface.wan.ip_address}
              - {label: Connection uptime, canonical: canonical.interface.wan.uptime, format: duration}
          - title: Management
            fields:
              - {label: Connection request URL, canonical: canonical.mgmt.connection_request_url}
              - {label: Inform interval, canonical: canonical.mgmt.periodic_inform_interval, format: seconds}
    - key: interfaces
      title: Interfaces
      icon: ethernet-port
      component: ports
      config:
        ports:
          - {id: wan, label: WAN, kind: wan, entity: canonical.interface.wan}
          - {id: lan1, label: "1", kind: ethernet, entity: canonical.interface.lan.1}
          - {id: lan2, label: "2", kind: ethernet, entity: canonical.interface.lan.2}
          - {id: lan3, label: "3", kind: ethernet, entity: canonical.interface.lan.3}
          - {id: lan4, label: "4", kind: ethernet, entity: canonical.interface.lan.4}
          - {id: wifi24, label: 2.4 GHz, kind: wifi, entity: canonical.wifi.radio.1}
          - {id: wifi5, label: 5 GHz, kind: wifi, entity: canonical.wifi.radio.2}
    - key: wifi-networks
      title: WiFi networks
      icon: wifi
      component: table
      config:
        entity: canonical.wifi.ssid
        columns:
          - {label: SSID, field: ssid}
          - {label: Status, field: status}
          - {label: Enabled, field: enable}
          - {label: BSSID, field: bssid}
    - key: radios
      title: Radios
      icon: antenna
      component: table
      config:
        entity: canonical.wifi.radio
        columns:
          - {label: Status, field: status}
          - {label: Enabled, field: enable}
          - {label: Channel, field: channel}
          - {label: Band, field: band}
    - key: network-map
      title: Network map
      icon: network
      component: topology
    - key: monitoring
      title: Monitoring
      icon: chart-line
      component: dashboard
      config:
        dashboard: tr098-traffic
    - key: dashboard
      title: Dashboard
      icon: layout-grid
      component: dashboard
    - key: diagnostics
      title: Diagnostics
      icon: stethoscope
      component: diagnostics
    - key: action-log
      title: Action log
      icon: history
      component: tasks
    - key: events
      title: Events
      icon: scroll-text
      component: events
    - key: maintenance
      title: Maintenance
      icon: wrench
      component: maintenance
