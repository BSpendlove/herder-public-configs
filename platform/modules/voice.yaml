# Voice service module: SIP line state and credentials, normalised
# across TR-104 (TR-098 gateways) and TR-104i2 (TR-181 gateways)
# through the canonical.voice.* namespace declared in
# baseline/tr098/voice.yaml and baseline/tr181/voice.yaml.
#
# The SIP password is `secret: true`: write-only, sealed into
# task_secrets for the one SetParameterValues that carries it, never
# readable back and never collected by telemetry. Line enablement is a
# string, not a bool, because TR-104 defines it as the enum
# Disabled/Quiescent/Enabled and a bool would flatten a state the CPE
# distinguishes.
apiVersion: modules.herder.io/v1alpha1
kind: ServiceModule
metadata:
  name: voice
spec:
  description: >-
    SIP voice lines: registration state, directory numbers and the
    credentials the CPE registers with.
  fields:
    - name: line_status
      canonical: canonical.voice.line.{i}.status
      type: string
      description: Registration status of the line.
    - name: line_enabled
      canonical: canonical.voice.line.{i}.enable
      type: string
      writable: true
      constraints:
        enum: [Enabled, Disabled, Quiescent]
      description: Administrative state of the line, TR-104 vocabulary.
    - name: directory_number
      canonical: canonical.voice.line.{i}.number
      type: string
      writable: true
      description: The directory number assigned to the line.
    - name: sip_username
      canonical: canonical.voice.line.{i}.sip.username
      type: string
      writable: true
      description: SIP authentication user name for the line.
    - name: sip_password
      canonical: canonical.voice.line.{i}.sip.password
      type: string
      writable: true
      secret: true
      description: SIP authentication password. Write-only.
    - name: sip_registrar
      canonical: canonical.voice.sip.registrar
      type: string
      writable: true
      description: Registrar server the CPE registers against.
    - name: sip_proxy
      canonical: canonical.voice.sip.proxy
      type: string
      writable: true
      description: Outbound SIP proxy.
